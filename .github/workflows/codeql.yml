name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

# The scheduled run resolves to the same github.ref as an ordinary push to
# main (refs/heads/main), so without separating them a push landing while
# the weekly scan is queued behind an in-progress run would silently evict
# it: one running + one pending per group, not a real queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deny-all at the top; the single job below grants what it needs itself.
# A workflow-level grant applies to every job the file will ever have, not
# just this one -- OpenSSF Scorecard's Token-Permissions check flags that as
# excessive regardless of how many jobs currently exist.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # 3.14, matching the Dockerfile's base image and requirements.txt's own
      # compile target (see CONTRIBUTING.md's Dependencies section) --
      # requirements.txt is only ever meant to be installed under the Python
      # version it was resolved for.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: matrix.language == 'python'
        with:
          python-version: "3.14"
          cache: pip

      # Hash-pinned runtime lockfile instead of a bare `pip install .`, so
      # CodeQL both analyzes the exact dependency versions actually shipped
      # in production and fails closed on a substituted/compromised package
      # on the index, same as the Dockerfile and CI's other jobs.
      - run: pip install --require-hashes -r requirements.txt
        if: matrix.language == 'python'

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
