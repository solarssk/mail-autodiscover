name: OpenSSF Scorecard

# Report-only independent check of controls this repo already claims (branch
# protection, pinned dependencies, token permissions, SAST, security policy,
# and so on): most of what Scorecard scores is already on the Tier 2 list, so
# this verifies existing items rather than adding a new burden. Nothing here
# gates a merge. See solarssk/playbook docs/openssf.md.
#
# Runs on push to the default branch, on branch-protection changes (one of the
# things Scorecard scores), and weekly -- a few checks depend on repository
# activity over time rather than the current diff. Deliberately kept off the
# pull request path.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 3"
  push:
    branches: ["main"]

# Deny-all at the top; the job below grants only what it needs. Scorecard's
# Token-Permissions check requires a top-level `permissions:` key to exist.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # Scorecard reads workflow files for its own checks
      id-token: write # sign and publish results to the public Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The default GITHUB_TOKEN has no Administration permission, so
      # Scorecard cannot read classic branch protection with it and
      # Branch-Protection errors out instead of scoring -- the same GitHub
      # API limitation documented at
      # https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md.
      # A GitHub App installation token, minted fresh per run with only
      # read-only Administration and read-only Contents, is preferred over a
      # standing PAT: it expires in about an hour, so there is nothing
      # long-lived to leak or rotate by hand. AUTOMATION_APP_* is this repo's
      # own dedicated App (Administration: Read-only, Contents: Read-only,
      # nothing else, installed only here) -- not shared with any other
      # repository, so a leaked key's blast radius stays scoped to this one
      # project. Named for the repo, not the one thing it happens to be used
      # for today, so a later, genuinely new narrowly-scoped need in this
      # repo can reuse it instead of spawning another App; its permission set
      # stays whatever the current uses actually need, expanded later (with
      # GitHub re-prompting for approval) only when a real one shows up, not
      # provisioned ahead of time.
      #
      # `secrets` isn't a valid context inside a step's `if:` (actionlint
      # catches this), so presence is checked here via `env:` (where secrets
      # ARE allowed) instead, and the next step's `if:` reads this step's
      # output -- `steps` is a valid `if:` context.
      - name: Check for automation app credentials
        id: app-check
        env:
          AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$AUTOMATION_APP_ID" ] && [ -n "$AUTOMATION_APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Skipped (not failed) when the app secrets don't exist yet.
      - name: Mint Scorecard read token
        id: app-token
        if: steps.app-check.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: read

      # publish_results only works on a public repository (this one is);
      # publishing is what makes the README badge and the public viewer work.
      #
      # repo_token is optional -- falls through, in order: the freshly minted
      # GitHub App token (best: short-lived, least privilege); a
      # SCORECARD_TOKEN fine-grained PAT (Administration: Read-only, no
      # expiry management via an App) if that's set up instead; the action's
      # own default GITHUB_TOKEN otherwise, same as today. A skipped step's
      # output and an unset secret both evaluate to an empty string, which is
      # falsy, so `||` correctly falls through each tier -- explicitly
      # passing an empty string here instead would override the action's own
      # GITHUB_TOKEN default with nothing, which is worse than not setting
      # this input at all.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ steps.app-token.outputs.token || secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
