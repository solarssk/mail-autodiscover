name: Verify standard

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-standard-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    uses: solarssk/playbook/.github/workflows/verify-tier.yml@13da3943c81dd251d470a2ac82fbed705c2e8a1a  # temporary integration test

  observe:
    name: Observe verifier outputs
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate actual reusable workflow outputs
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          AUTOMATED_CHECKS: ${{ needs.verify.outputs.automated_checks }}
          ASSESSMENT: ${{ needs.verify.outputs.assessment }}
        run: |
          printf 'result=%s\nautomated_checks=%s\nassessment=%s\n' \
            "$VERIFY_RESULT" "$AUTOMATED_CHECKS" "$ASSESSMENT"
          test "$VERIFY_RESULT" = success
          test "$AUTOMATED_CHECKS" = passed
          test "$ASSESSMENT" = partial
