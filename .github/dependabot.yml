# Every entry carries a cooldown: a version published minutes ago is the one
# most likely to be a compromised release that gets pulled within days, so
# Dependabot waits before proposing it. Security updates ignore the cooldown,
# so a real fix is never delayed by it (zizmor: dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "type: chore"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "type: chore"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "type: chore"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Transitive pin of pydantic; pip-compile resolves it against pydantic's
      # own constraint. Dependabot bumps it standalone without checking that
      # constraint, which breaks --require-hashes installs (see #71/#74).
      # Remove once pydantic itself releases a version compatible with the
      # newer pydantic-core.
      - dependency-name: "pydantic-core"
