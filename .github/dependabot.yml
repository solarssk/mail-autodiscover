version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Transitive pin of pydantic; pip-compile resolves it against pydantic's
      # own constraint. Dependabot bumps it standalone without checking that
      # constraint, which breaks --require-hashes installs (see #71/#74).
      # Remove once pydantic itself releases a version compatible with the
      # newer pydantic-core.
      - dependency-name: "pydantic-core"
