# Install once: pip install ".[dev]" && pre-commit install
# Runs automatically before each git commit.

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: mypy app
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true
